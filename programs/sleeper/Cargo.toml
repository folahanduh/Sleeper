[package]
name = "sleeper"
version = "0.1.0"
description = "Sleeper: songs as coins, settled on real-world traction"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sleeper"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions", "solana-v3"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "0.18.1"
solana-keypair = "3.1"
solana-signer = "3"
solana-message = "4.2"
solana-transaction = "4.1"
solana-instruction = "3.5"
solana-address = "2.7"
solana-clock = "3.2"
solana-system-interface = "3.2"
